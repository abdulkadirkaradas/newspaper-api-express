services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: newspaper_api
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
      - apps/api/.env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - newspaper-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: newspaper_web
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - newspaper-net

  postgres:
    image: postgres:15
    container_name: newspaper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newspaper-net

networks:
  newspaper-net:
    driver: bridge

volumes:
  postgres_data:
