services:
  api:
    build: .
    container_name: newspaper_api
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - postgres
    networks:
      - newspaperapi

  postgres:
    image: postgres:15
    container_name: newspaper_api_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newspaperapi

networks:
  newspaperapi:
    driver: bridge

volumes:
  postgres_data:
