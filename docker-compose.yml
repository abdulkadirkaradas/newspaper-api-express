version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newspaper_api
    ports:
      - "3000:3000"
    env_file:
      - .env
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
      # - /usr/src/app/node_modules
    depends_on:
      - postgres
    command: sh -c "npm run dev"
    networks:
      - newspaperapi

  postgres:
    image: postgres:15
    container_name: newspaper_api_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - newspaperapi

  pgadmin:
    image: dpage/pgadmin4
    container_name: newspaper_api_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - newspaperapi

networks:
  newspaperapi:
    driver: bridge

volumes:
  postgres_data:
