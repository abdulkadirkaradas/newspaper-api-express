services:
  # =========================
  # API STACK
  # =========================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: newspaper_api
    restart: always
    ports:
      - "${API_PORT}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
      - apps/api/.env
    environment:
      NODE_ENV: ${NODE_ENV}
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - postgres
    networks:
      - public-network
      - api-internal

  postgres:
    image: postgres:15
    container_name: newspaper_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-internal

  # =========================
  # WEB STACK
  # =========================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: newspaper_web
    restart: always
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - public-network
      - web-internal

networks:
  public-network:
    driver: bridge

  api-internal:
    driver: bridge
    internal: true

  web-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
